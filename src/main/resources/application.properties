# Connection Pool Configuration (adjusted for cloud deployment)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ===============================
# JWT CONFIGURATION
# ===============================
hospital.app.jwtSecret=hospitalManagementSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecureKey2024
hospital.app.jwtExpirationMs=86400000
hospital.app.jwtRefreshExpirationMs=604800000

# ===============================
# SECURITY CONFIGURATION
# ===============================
spring.security.user.name=admin
spring.security.user.password={bcrypt}$2a$12$VwrCXRkHbWbYI7Nf0fxDGu1J7Td3QKqW4eFh5rQvXcP8eY9Ku6/Ca
spring.security.user.roles=ADMIN

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.com.hospital.management=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/hospital-management.log
logging.file.max-size=10MB
logging.file.max-history=30

# ===============================
# CACHE CONFIGURATION
# ===============================
spring.cache.type=simple
spring.cache.cache-names=users,doctors,patients,nurses,lab-technicians,receptionists,admins,roles,permissions,audit-logs
spring.cache.caffeine.spec=maximumSize=1000,expireAfterAccess=300s

# ===============================
# ACTUATOR CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

# ===============================
# EMAIL CONFIGURATION (Optional)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata

# ===============================
# VALIDATION CONFIGURATION
# ===============================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ===============================
# CORS CONFIGURATION
# ===============================
hospital.app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:4200}
hospital.app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
hospital.app.cors.allowed-headers=*
hospital.app.cors.allow-credentials=true

# ===============================
# SYSTEM SETUP CONFIGURATION
# ===============================
hospital.app.system-setup-key=HMS_SETUP_2024_SECURE_KEY_CHANGE_IN_PRODUCTION
hospital.app.allow-patient-self-registration=true
hospital.app.email-verification-required=true
hospital.app.admin-approval-required=false

# ===============================
# AUDIT CONFIGURATION
# ===============================
hospital.app.audit.retention-days=90
hospital.app.audit.cleanup-enabled=true
hospital.app.audit.cleanup-cron=0 0 2 * * ?

# ===============================
# PROFILE CONFIGURATION
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
